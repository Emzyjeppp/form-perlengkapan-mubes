<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Perlengkapan MUBES — Formulir Rencana Anggaran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --paper: #f4f6f0;
      --panel: #ffffff;
      --ink: #17231d;
      --ink-soft: #5a6a62;
      --pine: #2e4a3f;
      --pine-light: #3d6153;
      --amber: #e0a21a;
      --amber-soft: #fcf5e5;
      --line: #dbe0d7;
      --danger: #b93829;
      --danger-soft: #fdf2f0;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --warning: #b45309;
      --warning-soft: #fffbeb;
      --radius: 8px;
      --gap: 20px;
      --display: "Archivo", system-ui, -apple-system, sans-serif;
      --body: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --shadow: 0 4px 20px rgba(23, 35, 29, 0.06);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--pine);
      outline-offset: 2px;
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: max(32px, env(safe-area-inset-top, 32px)) 16px max(32px, env(safe-area-inset-bottom, 32px));
    }

    /* Masthead Header */
    .masthead {
      border-bottom: 2px solid var(--ink);
      padding-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
    }

    .masthead__eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--pine);
      font-weight: 600;
      margin: 0 0 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      line-height: 1.3;
    }

    .masthead__title {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(20px, 5vw, 36px);
      line-height: 1.08;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin: 0;
    }

    .masthead__title span {
      display: block;
      color: var(--pine);
    }

    .masthead__actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .masthead__actions {
        display: flex;
        width: auto;
      }
    }

    .btn {
      border: 1.5px solid var(--ink);
      background: #ffffff;
      padding: 10px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      touch-action: manipulation;
    }

    .btn:hover {
      background: var(--ink);
      color: var(--panel);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn--primary {
      background: var(--amber);
      border-color: var(--ink);
      color: var(--ink);
    }

    .btn--primary:hover {
      background: var(--ink);
      color: var(--amber);
    }

    .btn--quiet {
      border-color: var(--line);
      color: var(--ink-soft);
      background: transparent;
    }

    .btn--quiet:hover {
      background: var(--line);
      color: var(--ink);
    }

    .btn--danger {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--danger-soft);
    }

    .btn--danger:hover {
      background: var(--danger);
      color: #ffffff;
    }

    /* Statusbar Bar */
    .statusbar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 14px;
      align-items: center;
      padding: 12px 0;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--line);
    }

    @media (min-width: 640px) {
      .statusbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 24px;
      }
    }

    .statusbar__badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--amber-soft);
      padding: 4px 10px;
      border-radius: 99px;
      color: var(--ink);
      font-weight: 600;
      white-space: nowrap;
      width: fit-content;
    }

    .statusbar__pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .statusbar strong {
      color: var(--ink);
      font-weight: 700;
    }

    .statusbar__budget {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
    }

    .statusbar__time {
      grid-column: span 2;
      font-size: 11px;
    }

    @media (min-width: 640px) {
      .statusbar__time {
        margin-left: auto;
        font-size: 12px;
      }
    }

    /* Search & Filter Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      background: #ffffff;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .toolbar__search {
      flex: 1 1 240px;
      position: relative;
    }

    .toolbar__search input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      font-size: 14px;
      background: #ffffff;
    }

    .toolbar__search input:focus {
      border-color: var(--pine);
    }

    .toolbar__search::before {
      content: "🔍";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
    }

    .toolbar__filter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1 1 auto;
    }

    .toolbar__filter select {
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 12px;
      font-size: 13px;
      background: #ffffff;
      font-weight: 600;
      min-width: 160px;
    }

    /* Layout & Sidebar Rail */
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
      margin-top: 16px;
      align-items: start;
    }

    @media (min-width: 860px) {
      .layout {
        grid-template-columns: 260px 1fr;
      }
    }

    .rail {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    @media (min-width: 860px) {
      .rail {
        position: sticky;
        top: 16px;
      }
    }

    .rail__caption {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding: 0 0 10px;
      margin: 0;
      font-weight: 600;
    }

    /* Grid Layout for Divisions (No Swipe) */
    .rail__list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    @media (min-width: 520px) and (max-width: 859px) {
      .rail__list {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (min-width: 860px) {
      .rail__list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
    }

    .division {
      width: 100%;
      text-align: left;
      background: #f8faf6;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    @media (min-width: 860px) {
      .division {
        border-left: 4px solid transparent;
        border-top: none;
        border-right: none;
        border-bottom: none;
        background: transparent;
      }
    }

    .division:hover {
      background: #eff3ea;
    }

    .division[aria-current="true"] {
      background: var(--pine);
      border-color: var(--pine);
      color: #ffffff;
    }

    @media (min-width: 860px) {
      .division[aria-current="true"] {
        border-left-color: var(--amber);
        background: var(--pine);
      }
    }

    .division[aria-current="true"] .division__name {
      color: #ffffff;
    }

    .division[aria-current="true"] .division__count {
      color: var(--pine);
      background: var(--amber);
    }

    .division__row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }

    .division__name {
      font-family: var(--display);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    @media (min-width: 640px) {
      .division__name {
        font-size: 13px;
      }
    }

    .division__count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-soft);
      font-weight: 600;
      background: rgba(0, 0, 0, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* Main Panel & Forms */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    @media (min-width: 640px) {
      .panel {
        padding: 24px;
      }
    }

    .panel__head {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .panel__title {
      font-family: var(--display);
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin: 0;
      color: var(--pine);
    }

    .panel__hint {
      font-size: 13px;
      color: var(--ink-soft);
      margin: 4px 0 0;
    }

    .panel__subtotal {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--pine);
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 4px 10px;
      border-radius: 6px;
    }

    /* SPACIOUS 2-ROW FORM GRID FOR DESKTOP & MOBILE */
    .entry {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: end;
      background: #f9fbf7;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    @media (min-width: 640px) {
      .entry {
        grid-template-columns: repeat(4, 1fr);
        gap: 14px 16px;
        padding: 20px;
      }

      .entry__field--name {
        grid-column: span 2;
      }

      .entry__field--qty {
        grid-column: span 1;
      }

      .entry__field--unit {
        grid-column: span 1;
      }

      .entry__field--source {
        grid-column: span 1;
      }

      .entry__field--price {
        grid-column: span 1;
      }

      .entry__field--status {
        grid-column: span 1;
      }

      .entry__submit {
        grid-column: span 1;
        align-self: end;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 600;
      white-space: nowrap;
    }

    .field input,
    .field select {
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      background: #ffffff;
      width: 100%;
      font-size: 14px;
      transition: border-color 0.15s ease;
      min-height: 44px;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--pine);
    }

    .entry__submit {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .entry__submit .btn {
      flex: 1;
      min-height: 44px;
    }

    .entry__error {
      color: var(--danger);
      font-size: 13px;
      margin: 8px 0 0;
      min-height: 20px;
      font-weight: 600;
    }

    /* Table & Card List */
    .table-wrap {
      margin-top: 16px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 720px;
    }

    th {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-align: left;
      padding: 12px 14px;
      background: #f1f4ed;
      border-bottom: 1.5px solid var(--ink);
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    tr:nth-child(even) td {
      background: #fafbf8;
    }

    .cell-no,
    .cell-qty,
    .cell-price {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .source-badge {
      display: inline-block;
      background: #edf1e8;
      border: 1px solid #d4dccf;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--pine);
      font-weight: 600;
    }

    /* Status Badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-badge--pending {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .status-badge--process {
      background: var(--warning-soft);
      color: var(--warning);
      border: 1px solid #fde68a;
    }

    .status-badge--ready {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid #bbf7d0;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .row-actions button {
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: var(--radius);
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      min-height: 36px;
      touch-action: manipulation;
    }

    .row-actions button:hover {
      background: var(--ink);
      color: #ffffff;
      border-color: var(--ink);
    }

    .row-actions .is-danger {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: #f7d2cd;
    }

    .row-actions .is-danger:hover {
      background: var(--danger);
      color: #ffffff;
      border-color: var(--danger);
    }

    .empty {
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
      color: var(--ink-soft);
      font-size: 14px;
      margin-top: 16px;
    }

    .panel__foot {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1.5px solid var(--line);
    }

    .panel__foot .btn {
      flex: 1;
    }

    @media (min-width: 640px) {
      .panel__foot .btn {
        flex: 0 0 auto;
      }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(160%);
      background: var(--ink);
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      width: max-content;
      max-width: 90vw;
      text-align: center;
    }

    .toast--visible {
      transform: translateX(-50%) translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="masthead">
      <div>
        <p class="masthead__eyebrow">
          <span>🏛️</span> PANITIA MUSYAWARAH BESAR (MUBES)
        </p>
        <h1 class="masthead__title">
          RENCANA ANGGARAN
          <span>PERLENGKAPAN MUBES</span>
        </h1>
      </div>
      <div class="masthead__actions">
        <button class="btn" id="exportCsvButton">📥 Unduh CSV</button>
        <button class="btn btn--primary" id="exportExcelButton">📊 Unduh Excel</button>
      </div>
    </header>

    <div class="statusbar">
      <div class="statusbar__badge">
        <span class="statusbar__pulse"></span>
        <span id="cloudStatus">Terhubung ke Cloud</span>
      </div>
      <span>Total barang: <strong id="totalItems">0</strong></span>
      <span>Divisi terisi: <strong id="filledDivisions">0 / 7</strong></span>
      <span class="statusbar__budget">Estimasi Total: <strong id="totalBudget">Rp 0</strong></span>
      <span class="statusbar__time" id="saveStatus">Sinkron otomatis...</span>
    </div>

    <!-- Search & Filter Toolbar -->
    <div class="toolbar">
      <div class="toolbar__search">
        <input id="searchInput" placeholder="Cari nama barang di semua divisi..." autocomplete="off" />
      </div>
      <div class="toolbar__filter">
        <select id="filterSource">
          <option value="">Semua Sumber</option>
          <option value="Inventaris organisasi">Inventaris organisasi</option>
          <option value="Pinjam sekretariat">Pinjam sekretariat</option>
          <option value="Pinjam kampus">Pinjam kampus</option>
          <option value="Pinjam UKM lain">Pinjam UKM lain</option>
          <option value="Milik panitia">Milik panitia</option>
          <option value="Sewa">Sewa</option>
          <option value="Beli">Beli</option>
          <option value="Pesan katering">Pesan katering</option>
        </select>
        <select id="filterStatus">
          <option value="">Semua Status</option>
          <option value="Belum Ada">🔴 Belum Ada</option>
          <option value="Dalam Proses">🟡 Dalam Proses</option>
          <option value="Sudah Siap">🟢 Sudah Siap</option>
        </select>
      </div>
    </div>

    <div class="layout">
      <!-- Division Rail Navigation -->
      <nav class="rail" aria-label="Daftar divisi">
        <p class="rail__caption">PILIH DIVISI</p>
        <div class="rail__list" id="divisionRail"></div>
      </nav>

      <!-- Main Data Panel -->
      <main class="panel">
        <div class="panel__head">
          <div>
            <h2 class="panel__title" id="panelTitle">SEKRETARIS</h2>
            <p class="panel__hint" id="panelHint">Memuat data divisi...</p>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="panel__subtotal" id="divisionSubtotal">Subtotal: Rp 0</span>
            <button class="btn btn--danger" id="clearDivisionButton">Kosongkan Divisi Ini</button>
          </div>
        </div>

        <form id="entryForm" novalidate>
          <div class="entry">
            <div class="field entry__field--name">
              <label for="itemName">Nama barang</label>
              <input id="itemName" name="itemName" autocomplete="off" placeholder="mis. Palu sidang / Laptop" />
            </div>
            <div class="field entry__field--qty">
              <label for="itemQuantity">Jumlah</label>
              <input id="itemQuantity" name="itemQuantity" type="number" min="1" step="1" value="1" />
            </div>
            <div class="field entry__field--unit">
              <label for="itemUnit">Satuan</label>
              <select id="itemUnit" name="itemUnit"></select>
            </div>

            <div class="field entry__field--source">
              <label for="itemSource">Sumber</label>
              <select id="itemSource" name="itemSource"></select>
            </div>
            <div class="field entry__field--price">
              <label for="itemPrice">Harga/Satuan (Rp)</label>
              <input id="itemPrice" name="itemPrice" type="number" min="0" step="500" value="0" placeholder="0" />
            </div>
            <div class="field entry__field--status">
              <label for="itemStatus">Status</label>
              <select id="itemStatus" name="itemStatus">
                <option value="Belum Ada">🔴 Belum Ada</option>
                <option value="Dalam Proses">🟡 Dalam Proses</option>
                <option value="Sudah Siap">🟢 Sudah Siap</option>
              </select>
            </div>
            <div class="entry__submit">
              <button class="btn btn--primary" type="submit" id="submitButton">+ Tambah</button>
              <button class="btn btn--quiet" type="button" id="cancelEditButton" hidden>Batal</button>
            </div>
          </div>
          <p class="entry__error" id="entryError" role="alert"></p>
        </form>

        <div id="tableContainer">
          <div class="table-wrap" id="tableWrap"></div>
        </div>

        <div class="panel__foot">
          <button class="btn btn--quiet" id="previousDivisionButton">← Divisi Sebelumnya</button>
          <button class="btn btn--quiet" id="nextDivisionButton">Divisi Berikutnya →</button>
        </div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const DIVISIONS = [
      "SEKRETARIS",
      "BENDAHARA",
      "SIE ACARA",
      "SIE KONSUMSI",
      "SIE PERKAB",
      "SIE PDD",
      "SIE HUMAS",
    ];

    const UNITS = [
      "buah",
      "unit",
      "set",
      "paket",
      "lembar",
      "rim",
      "dus",
      "kotak",
      "pak",
      "rol",
      "lusin",
      "eksemplar",
      "orang",
    ];

    const SOURCES = [
      "Inventaris organisasi",
      "Pinjam sekretariat",
      "Pinjam kampus",
      "Pinjam UKM lain",
      "Milik panitia",
      "Sewa",
      "Beli",
      "Pesan katering",
    ];

    const STORAGE_KEY = "mubes_perlengkapan_v3";
    const SHEET_NAME = "Data Peminjaman";
    const SHEET_TITLE = "RENCANA ANGGARAN PELAKSANAAN PERLENGKAPAN MUBES";

    // Supabase Cloud Backend Configuration
    const SUPABASE_URL = "https://izzfapunrshgghrbhhpf.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6emZhcHVucnNoZ2docmJoaHBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NTUzMzgsImV4cCI6MjA5OTUzMTMzOH0.TIgOngCo6R_7sKyw2h_nPthVNqO0H-5_TmOebtB0hyw";
    const SB_HEADERS = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };

    const createEmptyItems = () =>
      DIVISIONS.reduce((items, division) => ({ ...items, [division]: [] }), {});

    const state = {
      items: createEmptyItems(),
      activeDivision: DIVISIONS[0],
      editingId: null,
      isOnline: true,
      searchQuery: "",
      filterSource: "",
      filterStatus: ""
    };

    const elements = {
      rail: document.getElementById("divisionRail"),
      panelTitle: document.getElementById("panelTitle"),
      panelHint: document.getElementById("panelHint"),
      tableWrap: document.getElementById("tableWrap"),
      entryForm: document.getElementById("entryForm"),
      itemName: document.getElementById("itemName"),
      itemQuantity: document.getElementById("itemQuantity"),
      itemUnit: document.getElementById("itemUnit"),
      itemSource: document.getElementById("itemSource"),
      itemPrice: document.getElementById("itemPrice"),
      itemStatus: document.getElementById("itemStatus"),
      submitButton: document.getElementById("submitButton"),
      cancelEditButton: document.getElementById("cancelEditButton"),
      entryError: document.getElementById("entryError"),
      totalItems: document.getElementById("totalItems"),
      filledDivisions: document.getElementById("filledDivisions"),
      totalBudget: document.getElementById("totalBudget"),
      divisionSubtotal: document.getElementById("divisionSubtotal"),
      saveStatus: document.getElementById("saveStatus"),
      cloudStatus: document.getElementById("cloudStatus"),
      searchInput: document.getElementById("searchInput"),
      filterSource: document.getElementById("filterSource"),
      filterStatus: document.getElementById("filterStatus"),
      toast: document.getElementById("toast"),
    };

    const formatRupiah = (number) => {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(number || 0);
    };

    // Cloud Persistence with Supabase & LocalStorage Fallback
    const cloudStorage = {
      async load() {
        try {
          const res = await fetch(
            `${SUPABASE_URL}/rest/v1/wishes?name=eq.MUBES_DATA_V2&order=id.desc&limit=1`,
            { headers: SB_HEADERS }
          );
          if (res.ok) {
            const data = await res.json();
            if (data && data.length > 0 && data[0].message) {
              const parsed = JSON.parse(data[0].message);
              state.isOnline = true;
              return parsed;
            }
          }
        } catch (e) {
          console.warn("Supabase load fallback to local:", e);
          state.isOnline = false;
        }

        // Fallback to LocalStorage
        try {
          const local = localStorage.getItem(STORAGE_KEY);
          return local ? JSON.parse(local) : null;
        } catch (e) {
          return null;
        }
      },

      async save(items) {
        // Save to LocalStorage immediately
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        } catch (e) {}

        // Sync to Supabase Cloud so all users see it
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/wishes`, {
            method: "POST",
            headers: { ...SB_HEADERS, "Prefer": "return=minimal" },
            body: JSON.stringify({
              name: "MUBES_DATA_V2",
              message: JSON.stringify(items)
            })
          });
          state.isOnline = res.ok;
          return res.ok;
        } catch (e) {
          console.warn("Supabase save failed:", e);
          state.isOnline = false;
          return false;
        }
      }
    };

    const createId = () => `item-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;

    const countAllItems = () =>
      DIVISIONS.reduce((total, division) => total + (state.items[division] ? state.items[division].length : 0), 0);

    const calculateGrandTotal = () => {
      let total = 0;
      DIVISIONS.forEach((div) => {
        (state.items[div] || []).forEach((item) => {
          total += (item.price || 0) * (item.quantity || 1);
        });
      });
      return total;
    };

    const calculateDivisionTotal = (division) => {
      let total = 0;
      (state.items[division] || []).forEach((item) => {
        total += (item.price || 0) * (item.quantity || 1);
      });
      return total;
    };

    const countFilledDivisions = () =>
      DIVISIONS.filter((division) => state.items[division] && state.items[division].length > 0).length;

    const activeItems = () => {
      let list = state.items[state.activeDivision] || [];
      
      // Apply Search Filter
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        list = list.filter((item) => item.name.toLowerCase().includes(q));
      }

      // Apply Source Filter
      if (state.filterSource) {
        list = list.filter((item) => item.source === state.filterSource);
      }

      // Apply Status Filter
      if (state.filterStatus) {
        list = list.filter((item) => (item.status || "Belum Ada") === state.filterStatus);
      }

      return list;
    };

    function fillSelect(select, options) {
      select.innerHTML = options
        .map((option) => `<option value="${option}">${option}</option>`)
        .join("");
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("toast--visible");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(
        () => elements.toast.classList.remove("toast--visible"),
        2600
      );
    }

    async function persist(statusMessage) {
      const savedCloud = await cloudStorage.save(state.items);
      elements.cloudStatus.textContent = savedCloud ? "Terhubung ke Cloud" : "Tersimpan Lokal";
      elements.saveStatus.textContent = `Tersimpan · ${new Date().toLocaleTimeString("id-ID")}`;
      if (statusMessage) showToast(statusMessage);
    }

    function renderRail() {
      const railItems = DIVISIONS.map((division) => {
        const count = state.items[division] ? state.items[division].length : 0;
        return `
          <button class="division" type="button" data-division="${division}"
                  aria-current="${division === state.activeDivision}">
            <span class="division__row">
              <span class="division__name">${division}</span>
              <span class="division__count">${count} barang</span>
            </span>
          </button>`;
      }).join("");

      elements.rail.innerHTML = railItems;
    }

    function getStatusBadge(status) {
      const s = status || "Belum Ada";
      if (s === "Sudah Siap") {
        return `<span class="status-badge status-badge--ready">🟢 Sudah Siap</span>`;
      }
      if (s === "Dalam Proses") {
        return `<span class="status-badge status-badge--process">🟡 Dalam Proses</span>`;
      }
      return `<span class="status-badge status-badge--pending">🔴 Belum Ada</span>`;
    }

    function renderTable() {
      const items = activeItems();

      if (items.length === 0) {
        elements.tableWrap.innerHTML =
          `<p class="empty">Belum ada barang untuk divisi <strong>${state.activeDivision}</strong> yang sesuai filter.<br>Tambahkan barang baru atau ubah kata kunci pencarian.</p>`;
        return;
      }

      const rows = items
        .map(
          (item, index) => {
            const rowTotal = (item.price || 0) * (item.quantity || 1);
            return `
            <tr>
              <td class="cell-no">${index + 1}</td>
              <td><strong>${escapeHtml(item.name)}</strong></td>
              <td class="cell-qty">${item.quantity} ${escapeHtml(item.unit)}</td>
              <td><span class="source-badge">${escapeHtml(item.source)}</span></td>
              <td class="cell-price">${formatRupiah(item.price || 0)}</td>
              <td class="cell-price"><strong>${formatRupiah(rowTotal)}</strong></td>
              <td>${getStatusBadge(item.status)}</td>
              <td>
                <span class="row-actions">
                  <button type="button" data-action="edit" data-id="${item.id}">✏️ Ubah</button>
                  <button type="button" class="is-danger" data-action="delete" data-id="${item.id}">🗑️ Hapus</button>
                </span>
              </td>
            </tr>`;
          }
        )
        .join("");

      elements.tableWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th style="width:40px">No</th>
              <th>Nama Barang</th>
              <th style="width:110px">Jumlah</th>
              <th style="width:150px">Sumber</th>
              <th style="width:130px">Harga Satuan</th>
              <th style="width:130px">Total Biaya</th>
              <th style="width:130px">Status Kesiapan</th>
              <th style="width:130px; text-align:right;">Aksi</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderPanel() {
      const count = activeItems().length;
      elements.panelTitle.textContent = state.activeDivision;
      elements.panelHint.textContent =
        count === 0
          ? "Belum ada barang yang dicatat."
          : `${count} barang ditampilkan untuk divisi ini.`;
      
      const subtotal = calculateDivisionTotal(state.activeDivision);
      elements.divisionSubtotal.textContent = `Subtotal: ${formatRupiah(subtotal)}`;

      renderTable();
    }

    function renderSummary() {
      elements.totalItems.textContent = countAllItems();
      elements.filledDivisions.textContent = `${countFilledDivisions()} / ${DIVISIONS.length}`;
      elements.totalBudget.textContent = formatRupiah(calculateGrandTotal());
    }

    function render() {
      renderRail();
      renderPanel();
      renderSummary();
    }

    function resetForm() {
      state.editingId = null;
      elements.entryForm.reset();
      elements.itemQuantity.value = 1;
      elements.itemPrice.value = 0;
      elements.itemStatus.value = "Belum Ada";
      elements.entryError.textContent = "";
      elements.submitButton.textContent = "+ Tambah";
      elements.cancelEditButton.hidden = true;
    }

    function readForm() {
      return {
        name: elements.itemName.value.trim(),
        quantity: Number(elements.itemQuantity.value),
        unit: elements.itemUnit.value,
        source: elements.itemSource.value,
        price: Number(elements.itemPrice.value) || 0,
        status: elements.itemStatus.value || "Belum Ada"
      };
    }

    function validate({ name, quantity }) {
      if (!name) return "Nama barang wajib diisi.";
      if (!Number.isFinite(quantity) || quantity < 1) return "Jumlah minimal 1.";
      return "";
    }

    function startEditing(id) {
      const item = (state.items[state.activeDivision] || []).find((candidate) => candidate.id === id);
      if (!item) return;

      state.editingId = id;
      elements.itemName.value = item.name;
      elements.itemQuantity.value = item.quantity;
      elements.itemUnit.value = item.unit;
      elements.itemSource.value = item.source;
      elements.itemPrice.value = item.price || 0;
      elements.itemStatus.value = item.status || "Belum Ada";
      elements.submitButton.textContent = "💾 Simpan";
      elements.cancelEditButton.hidden = false;
      elements.itemName.focus();
    }

    async function deleteItem(id) {
      if (!confirm("Hapus barang ini dari divisi " + state.activeDivision + "?")) return;
      state.items[state.activeDivision] = (state.items[state.activeDivision] || []).filter((item) => item.id !== id);
      if (state.editingId === id) resetForm();
      render();
      await persist("Barang dihapus");
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const values = readForm();
      const error = validate(values);
      elements.entryError.textContent = error;
      if (error) {
        elements.itemName.focus();
        return;
      }

      if (!state.items[state.activeDivision]) {
        state.items[state.activeDivision] = [];
      }

      if (state.editingId) {
        state.items[state.activeDivision] = state.items[state.activeDivision].map((item) =>
          item.id === state.editingId ? { ...item, ...values } : item
        );
        resetForm();
        render();
        await persist("Perubahan disimpan");
        return;
      }

      state.items[state.activeDivision].push({ id: createId(), ...values });
      resetForm();
      render();
      elements.itemName.focus();
      await persist("Barang ditambahkan ke cloud");
    }

    function selectDivision(division) {
      state.activeDivision = division;
      resetForm();
      render();
    }

    function shiftDivision(step) {
      const index = DIVISIONS.indexOf(state.activeDivision);
      const nextIndex = (index + step + DIVISIONS.length) % DIVISIONS.length;
      selectDivision(DIVISIONS[nextIndex]);
    }

    async function clearActiveDivision() {
      if ((state.items[state.activeDivision] || []).length === 0) return;
      const confirmed = window.confirm(`Kosongkan seluruh barang di divisi ${state.activeDivision}?`);
      if (!confirmed) return;

      state.items[state.activeDivision] = [];
      resetForm();
      render();
      await persist("Divisi dikosongkan");
    }

    function buildSheetMatrix() {
      const matrix = [[], [SHEET_TITLE], ["NO", "NAMA BARANG", "JUMLAH BARANG", "SUMBER", "HARGA SATUAN", "TOTAL BIAYA", "STATUS KESIAPAN"]];
      const merges = [
        { s: { r: 1, c: 0 }, e: { r: 1, c: 6 } },
        { s: { r: 2, c: 0 }, e: { r: 2, c: 0 } },
      ];

      DIVISIONS.forEach((division) => {
        merges.push({
          s: { r: matrix.length, c: 0 },
          e: { r: matrix.length, c: 6 },
        });
        matrix.push([division]);

        const items = state.items[division] || [];
        items.forEach((item, index) => {
          const rowTotal = (item.price || 0) * (item.quantity || 1);
          matrix.push([
            index + 1,
            item.name,
            `${item.quantity} ${item.unit}`,
            item.source,
            formatRupiah(item.price || 0),
            formatRupiah(rowTotal),
            item.status || "Belum Ada"
          ]);
        });
      });

      matrix.push([]);
      matrix.push(["ESTIMASI TOTAL ANGGARAN PERLENGKAPAN MUBES", "", "", "", "", formatRupiah(calculateGrandTotal()), ""]);

      return { matrix, merges };
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    function exportExcel() {
      if (countAllItems() === 0) {
        showToast("Belum ada barang untuk diunduh");
        return;
      }

      const { matrix, merges } = buildSheetMatrix();
      const sheet = XLSX.utils.aoa_to_sheet(matrix);
      sheet["!cols"] = [{ wch: 6 }, { wch: 36 }, { wch: 18 }, { wch: 24 }, { wch: 18 }, { wch: 18 }, { wch: 16 }];
      sheet["!merges"] = merges;

      const book = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(book, sheet, SHEET_NAME);
      XLSX.writeFile(book, "Perlengkapan_MUBES.xlsx");
      showToast("Berkas Excel berhasil diunduh");
    }

    function exportCsv() {
      if (countAllItems() === 0) {
        showToast("Belum ada barang untuk diunduh");
        return;
      }

      const escapeCell = (value) => `"${String(value).replace(/"/g, '""')}"`;
      const lines = [["DIVISI", "NO", "NAMA BARANG", "JUMLAH BARANG", "SUMBER", "HARGA SATUAN", "TOTAL BIAYA", "STATUS KESIAPAN"]];

      DIVISIONS.forEach((division) => {
        const items = state.items[division] || [];
        items.forEach((item, index) => {
          const rowTotal = (item.price || 0) * (item.quantity || 1);
          lines.push([
            division,
            index + 1,
            item.name,
            `${item.quantity} ${item.unit}`,
            item.source,
            formatRupiah(item.price || 0),
            formatRupiah(rowTotal),
            item.status || "Belum Ada"
          ]);
        });
      });

      const csv = lines.map((line) => line.map(escapeCell).join(",")).join("\r\n");
      downloadBlob(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }), "Perlengkapan_MUBES.csv");
      showToast("Berkas CSV berhasil diunduh");
    }

    function handleRailClick(event) {
      const button = event.target.closest("[data-division]");
      if (button) selectDivision(button.dataset.division);
    }

    function handleTableClick(event) {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      if (button.dataset.action === "edit") startEditing(button.dataset.id);
      if (button.dataset.action === "delete") deleteItem(button.dataset.id);
    }

    async function restoreSavedItems() {
      const saved = await cloudStorage.load();
      if (!saved) return;

      DIVISIONS.forEach((division) => {
        if (Array.isArray(saved[division])) state.items[division] = saved[division];
      });
      elements.saveStatus.textContent = "Data cloud terbaru dimuat";
      elements.cloudStatus.textContent = "Terhubung ke Cloud";
    }

    // Auto sync polling every 10 seconds for real-time collaboration
    function startAutoSync() {
      setInterval(async () => {
        const cloudData = await cloudStorage.load();
        if (cloudData) {
          let updated = false;
          DIVISIONS.forEach((div) => {
            if (JSON.stringify(state.items[div]) !== JSON.stringify(cloudData[div])) {
              if (Array.isArray(cloudData[div])) {
                state.items[div] = cloudData[div];
                updated = true;
              }
            }
          });
          if (updated) {
            render();
            elements.saveStatus.textContent = `Disinkronkan · ${new Date().toLocaleTimeString("id-ID")}`;
          }
        }
      }, 10000);
    }

    async function start() {
      fillSelect(elements.itemUnit, UNITS);
      fillSelect(elements.itemSource, SOURCES);

      elements.entryForm.addEventListener("submit", handleSubmit);
      elements.cancelEditButton.addEventListener("click", resetForm);
      elements.rail.addEventListener("click", handleRailClick);
      elements.tableWrap.addEventListener("click", handleTableClick);
      document.getElementById("clearDivisionButton").addEventListener("click", clearActiveDivision);
      document.getElementById("exportExcelButton").addEventListener("click", exportExcel);
      document.getElementById("exportCsvButton").addEventListener("click", exportCsv);
      document.getElementById("previousDivisionButton").addEventListener("click", () => shiftDivision(-1));
      document.getElementById("nextDivisionButton").addEventListener("click", () => shiftDivision(1));

      // Toolbar Search & Filters
      elements.searchInput.addEventListener("input", (e) => {
        state.searchQuery = e.target.value;
        renderPanel();
      });

      elements.filterSource.addEventListener("change", (e) => {
        state.filterSource = e.target.value;
        renderPanel();
      });

      elements.filterStatus.addEventListener("change", (e) => {
        state.filterStatus = e.target.value;
        renderPanel();
      });

      await restoreSavedItems();
      render();
      startAutoSync();
    }

    start();
  </script>
</body>
</html>
